<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KubeLab — Interactive Kubernetes Learning Lab</title>
<style>
  :root {
    --k8s-blue: #326ce5;
    --k8s-blue-dark: #2450a8;
    --bg: #0b0f17;
    --panel: #141a24;
    --panel-2: #1b2430;
    --panel-3: #222d3d;
    --border: #2a3446;
    --text: #e6edf3;
    --muted: #8b98a9;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --cyan: #56d4dd;
    --purple: #a371f7;
    --pink: #db61a2;
    --mono: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 85% -15%, #16233f 0%, var(--bg) 55%);
    color: var(--text); font-family: var(--sans); font-size: 14px;
  }
  a { color: var(--k8s-blue); }
  code, .mono { font-family: var(--mono); }

  /* Layout */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .sidebar {
    background: #0c121c; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
  .brand svg { width: 30px; height: 30px; }
  .brand h1 { font-size: 17px; margin: 0; }
  .brand h1 span { color: var(--k8s-blue); }
  .brand small { display:block; color: var(--muted); font-size: 10px; letter-spacing:.4px; }
  nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  nav .navgroup { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; padding: 12px 10px 4px; }
  nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: none; color: var(--text); padding: 9px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; font-family: var(--sans);
  }
  nav button .ic { width: 18px; text-align: center; opacity: .9; }
  nav button:hover { background: var(--panel-2); }
  nav button.active { background: linear-gradient(90deg, rgba(50,108,229,.28), rgba(50,108,229,.05)); color:#fff; box-shadow: inset 2px 0 0 var(--k8s-blue); }
  .sidebar .foot { margin-top: auto; padding: 12px; color: var(--muted); font-size: 10.5px; border-top: 1px solid var(--border); }

  .main { padding: 22px 28px 60px; max-width: 1200px; }
  .view { display: none; animation: fade .25s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none; } }

  h2.title { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; max-width: 780px; line-height: 1.5; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .panel .ph { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; background: var(--panel-2); border-radius: 12px 12px 0 0; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .panel .pb { padding: 16px; }
  .grid { display: grid; gap: 16px; }
  .cols-2 { grid-template-columns: 1fr 1fr; }
  .cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }

  .btn { background: var(--k8s-blue); color:#fff; border:none; padding: 9px 16px; border-radius: 8px; cursor:pointer; font-size: 13px; font-weight:600; font-family: var(--sans); }
  .btn:hover { background: var(--k8s-blue-dark); }
  .btn.ghost { background: var(--panel-3); }
  .btn.ghost:hover { background: #2b3850; }
  .btn.sm { padding: 6px 10px; font-size: 12px; }
  .btn:disabled { opacity:.5; cursor: not-allowed; }

  label.fld { display:block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; background: #0c121c; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 13px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--k8s-blue); }
  .row { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .switch { display:inline-flex; align-items:center; gap:8px; font-size: 13px; cursor:pointer; user-select:none; }
  .switch input { width: 36px; height: 20px; appearance:none; background: var(--panel-3); border-radius: 999px; position: relative; cursor:pointer; transition:.2s; }
  .switch input:checked { background: var(--green); }
  .switch input::after { content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:2px; transition:.2s; }
  .switch input:checked::after { left: 18px; }

  .pill { display:inline-flex; align-items:center; gap:6px; font-size: 11px; padding: 2px 9px; border-radius: 999px; border:1px solid var(--border); }
  .pill.ok { color: var(--green); border-color: rgba(63,185,80,.4); background: rgba(63,185,80,.08); }
  .pill.no { color: var(--red); border-color: rgba(248,81,73,.4); background: rgba(248,81,73,.08); }
  .pill.warn { color: var(--amber); border-color: rgba(210,153,34,.4); background: rgba(210,153,34,.08); }
  .pill.info { color: var(--cyan); border-color: rgba(86,212,221,.4); background: rgba(86,212,221,.08); }

  .card-btn { text-align:left; background: var(--panel); border:1px solid var(--border); border-radius: 12px; padding: 16px; cursor:pointer; transition:.15s; color:var(--text); font-family:var(--sans); }
  .card-btn:hover { border-color: var(--k8s-blue); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.35); }
  .card-btn h3 { margin: 0 0 6px; font-size: 15px; }
  .card-btn p { margin:0; color: var(--muted); font-size: 12.5px; line-height:1.5; }
  .card-btn .emoji { font-size: 20px; }

  table { width:100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
  th, td { text-align:left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size:10px; text-transform: uppercase; letter-spacing:.5px; }

  .log { font-family: var(--mono); font-size: 12.5px; background:#0a0e14; border:1px solid var(--border); border-radius: 10px; padding: 12px; min-height: 120px; max-height: 320px; overflow-y:auto; white-space: pre-wrap; line-height:1.55; }
  .log .ok { color: var(--green); } .log .err { color: var(--red); } .log .muted { color: var(--muted); } .log .info { color: var(--cyan); } .log .warn { color: var(--amber); }

  /* Architecture diagram */
  .arch { display:grid; gap: 16px; }
  .arch .plane { border:1px dashed var(--border); border-radius: 12px; padding: 14px; position: relative; }
  .arch .plane .lbl { position:absolute; top:-10px; left: 14px; background: var(--bg); padding: 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing:.5px; }
  .comp-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; }
  .comp { border:1px solid var(--border); border-radius: 10px; padding: 12px; cursor:pointer; background: var(--panel-2); transition:.15s; }
  .comp:hover { border-color: var(--k8s-blue); transform: translateY(-2px); }
  .comp.sel { border-color: var(--k8s-blue); box-shadow: 0 0 0 1px var(--k8s-blue) inset; }
  .comp .cn { font-weight:600; font-size: 13px; display:flex; align-items:center; gap:8px; }
  .comp .cd { color: var(--muted); font-size: 11.5px; margin-top: 4px; line-height: 1.4; }
  .comp.flash { animation: flash 1s ease; }
  @keyframes flash { 0%,100%{ box-shadow:none;} 40%{ box-shadow: 0 0 0 3px rgba(50,108,229,.6);} }

  /* Request flow pipeline */
  .pipeline { position: relative; display:flex; align-items:stretch; gap: 10px; overflow-x:auto; padding: 26px 6px 14px; }
  .stage { flex: 1 0 120px; border:1px solid var(--border); border-radius: 10px; background: var(--panel-2); padding: 12px 10px; text-align:center; position: relative; transition:.2s; min-width: 120px; }
  .stage .st-name { font-size: 12.5px; font-weight:600; }
  .stage .st-sub { font-size: 10.5px; color: var(--muted); margin-top: 4px; min-height: 26px; }
  .stage .st-icon { font-size: 20px; }
  .stage.active { border-color: var(--k8s-blue); box-shadow: 0 0 0 2px rgba(50,108,229,.4); }
  .stage.pass { border-color: var(--green); background: rgba(63,185,80,.08); }
  .stage.fail { border-color: var(--red); background: rgba(248,81,73,.12); }
  .stage .arrow { position:absolute; right:-11px; top:50%; transform: translateY(-50%); color: var(--border); font-size: 16px; z-index:1; }
  #flow-token {
    position: absolute; top: 2px; left: 0; width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, var(--k8s-blue), #6ea8ff); display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 14px rgba(50,108,229,.6); transition: transform 1s cubic-bezier(.5,.05,.3,1); z-index: 5; font-size: 16px;
    opacity: 0;
  }

  .kv { display:grid; grid-template-columns: 130px 1fr; gap: 4px 10px; font-size: 12.5px; }
  .kv div:nth-child(odd){ color: var(--muted); }
  .findings .f { display:flex; gap:10px; align-items:flex-start; padding: 9px 10px; border:1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  .sev { font-size:10px; font-weight:700; padding: 2px 7px; border-radius: 6px; flex: 0 0 auto; }
  .sev.critical { background: rgba(248,81,73,.15); color: var(--red);} .sev.high { background: rgba(219,97,162,.15); color: var(--pink);} .sev.medium{ background: rgba(210,153,34,.15); color: var(--amber);} .sev.low{ background: rgba(86,212,221,.12); color: var(--cyan);} .sev.pass{ background: rgba(63,185,80,.15); color: var(--green);}
  .score { font-size: 34px; font-weight: 800; }

  /* topology (playground) */
  .nodes { display:grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 12px; }
  .node { border:1px solid var(--border); border-radius:10px; background: linear-gradient(180deg,var(--panel-2),var(--panel)); padding:10px; min-height: 110px; }
  .node .nh { display:flex; justify-content:space-between; margin-bottom:8px; }
  .node .nn { font-family: var(--mono); font-size:12px; color: var(--cyan); }
  .dot{ width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
  .dot.Ready,.dot.Running{background:var(--green);box-shadow:0 0 6px var(--green);}
  .dot.Pending{background:var(--amber);} .dot.ContainerCreating{background:var(--cyan);} .dot.Terminating{background:var(--red);}
  .podz{ display:flex; flex-wrap:wrap; gap:6px; }
  .pod{ width:38px;height:38px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:#10233f;position:relative;transition:.12s;}
  .pod svg{width:20px;height:20px;color:var(--muted);}
  .pod.Running svg{color:var(--green);} .pod.Pending svg{color:var(--amber);} .pod.ContainerCreating svg{color:var(--cyan);animation:spin 1.3s linear infinite;} .pod.Terminating{opacity:.4;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #terminal{ font-family:var(--mono);font-size:12.5px;line-height:1.5;background:#0a0e14;padding:12px 14px;height:230px;overflow-y:auto;white-space:pre-wrap;border-radius:10px;border:1px solid var(--border);}
  #terminal .prompt{color:var(--k8s-blue);} #terminal .err{color:var(--red);} #terminal .ok{color:var(--green);} #terminal .muted{color:var(--muted);}
  .terminput{ display:flex;gap:8px;align-items:center;margin-top:8px; }
  .terminput .prompt{color:var(--k8s-blue);font-family:var(--mono);}
  #cmd{flex:1;background:#0a0e14;border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;}

  /* reconcile / operator */
  .recon { display:flex; flex-direction:column; gap:8px; }
  .rstep{ display:flex; gap:10px; align-items:center; padding: 8px 10px; border:1px solid var(--border); border-radius:8px; opacity:.4; transition:.2s;}
  .rstep.on{ opacity:1; border-color: var(--k8s-blue);}
  .rstep.done{ opacity:1; border-color: var(--green);}
  .rstep .rn{ font-size: 12.5px; }
  .managed { display:flex; gap:10px; flex-wrap:wrap; }
  .managed .m{ border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-family:var(--mono); font-size:12px; opacity:0; transform: scale(.9); transition:.25s; }
  .managed .m.show{ opacity:1; transform:none; border-color: var(--green); }

  /* quiz */
  .quiz-opt{ display:block; width:100%; text-align:left; border:1px solid var(--border); background: var(--panel-2); color:var(--text); padding: 11px 14px; border-radius:8px; margin-bottom:8px; cursor:pointer; font-size:13.5px; font-family:var(--sans);}
  .quiz-opt:hover{ border-color: var(--k8s-blue); }
  .quiz-opt.correct{ border-color: var(--green); background: rgba(63,185,80,.12);}
  .quiz-opt.wrong{ border-color: var(--red); background: rgba(248,81,73,.12);}
  .expl{ margin-top:10px; padding: 10px 12px; border-left: 3px solid var(--k8s-blue); background: var(--panel-2); border-radius: 0 8px 8px 0; font-size: 13px; line-height:1.5; color:#cdd8e3; }

  .flash-card{ perspective: 1200px; }
  details.faq{ border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background: var(--panel); }
  details.faq summary{ cursor:pointer; padding: 12px 14px; font-weight:600; list-style:none; }
  details.faq summary::-webkit-details-marker{ display:none; }
  details.faq[open] summary{ border-bottom:1px solid var(--border); }
  details.faq .a{ padding: 12px 14px; color:#cdd8e3; font-size:13px; line-height:1.55; }
  .hint { color: var(--muted); font-size: 12px; }
  .tag2 { font-size:10px; color:var(--muted); border:1px solid var(--border); padding:1px 7px; border-radius:999px; }
  .badge-count { background: var(--panel-3); color: var(--text); border-radius: 999px; font-size: 11px; padding: 1px 8px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 128 128"><path fill="#326ce5" d="M63.7 5.9 16.9 28.5a8 8 0 0 0-4.3 5.4L1.1 84.9a8 8 0 0 0 1.5 6.8l32.4 40.3a8 8 0 0 0 6.2 3h51.9a8 8 0 0 0 6.2-3l32.4-40.3a8 8 0 0 0 1.5-6.8l-11.6-51a8 8 0 0 0-4.3-5.4L70.5 5.9a8 8 0 0 0-6.8 0z" transform="scale(.9) translate(6 -1)"/><g fill="#fff"><circle cx="64" cy="40" r="6"/><circle cx="64" cy="88" r="6"/><circle cx="40" cy="54" r="6"/><circle cx="88" cy="54" r="6"/><circle cx="44" cy="82" r="6"/><circle cx="84" cy="82" r="6"/><circle cx="64" cy="64" r="9"/></g></svg>
      <div><h1><span>Kube</span>Lab</h1><small>learn · explore · interview‑prep</small></div>
    </div>
    <nav id="nav">
      <div class="navgroup">Learn</div>
      <button data-view="overview"><span class="ic">🏠</span> Overview</button>
      <button data-view="architecture"><span class="ic">🏗️</span> Architecture</button>
      <button data-view="flow"><span class="ic">🌊</span> Request Flow</button>
      <div class="navgroup">Security &amp; Policy</div>
      <button data-view="rbac"><span class="ic">🔐</span> RBAC Lab</button>
      <button data-view="security"><span class="ic">🛡️</span> Container Security</button>
      <button data-view="opa"><span class="ic">⚖️</span> OPA / Admission</button>
      <button data-view="secmap"><span class="ic">🗺️</span> Security Map</button>
      <button data-view="authn"><span class="ic">🪪</span> AuthN Deep Dive</button>
      <div class="navgroup">Extend &amp; Practice</div>
      <button data-view="operators"><span class="ic">🤖</span> Operators &amp; CRDs</button>
      <button data-view="playground"><span class="ic">💻</span> kubectl Playground</button>
      <button data-view="interview"><span class="ic">🎓</span> Interview Prep</button>
    </nav>
    <div class="foot">100% client‑side simulator.<br/>No cluster, no data leaves your browser.</div>
  </aside>

  <main class="main">
    <section class="view" id="view-overview"></section>
    <section class="view" id="view-architecture"></section>
    <section class="view" id="view-flow"></section>
    <section class="view" id="view-rbac"></section>
    <section class="view" id="view-security"></section>
    <section class="view" id="view-opa"></section>
    <section class="view" id="view-operators"></section>
    <section class="view" id="view-playground"></section>
    <section class="view" id="view-interview"></section>
  </main>
</div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// ===========================================================================
// SHARED APP STATE — the same identity / RBAC / OPA / pod spec feed the
// Request Flow, RBAC, Security and OPA labs so the platform is cohesive.
// ===========================================================================
const APP = {
  identity: "system:serviceaccount:default:deployer",
  identities: ["dev-user", "ops-admin", "system:serviceaccount:default:deployer", "system:serviceaccount:default:web-sa"],
  rbac: {
    roles: {
      "pod-reader": { rules: [{ apiGroups: [""], resources: ["pods"], verbs: ["get", "list", "watch"] }] },
      "pod-creator": { rules: [{ apiGroups: [""], resources: ["pods"], verbs: ["create", "get", "list"] }] },
      "deploy-admin": { rules: [{ apiGroups: ["apps"], resources: ["deployments"], verbs: ["*"] }] },
      "cluster-admin": { rules: [{ apiGroups: ["*"], resources: ["*"], verbs: ["*"] }] },
    },
    bindings: [
      { kind: "User", subject: "dev-user", role: "pod-reader" },
      { kind: "User", subject: "ops-admin", role: "cluster-admin" },
      { kind: "ServiceAccount", subject: "system:serviceaccount:default:deployer", role: "pod-creator" },
    ],
  },
  opa: [
    { id: "no-latest", name: "block :latest image tag", enabled: true, sev: "medium",
      rego: 'violation[msg] {\n  endswith(input.image, ":latest")\n  msg := "images must not use the :latest tag"\n}',
      check: p => (/:latest$/.test(p.image) || !p.image.includes(":")) ? "image uses :latest (or no) tag — pin an explicit version" : null },
    { id: "require-label", name: "require 'app' label", enabled: true, sev: "low",
      rego: 'violation[msg] {\n  not input.labels.app\n  msg := "every pod must carry an app label"\n}',
      check: p => p.labels && p.labels.app ? null : "missing required label: app" },
    { id: "no-privileged", name: "disallow privileged containers", enabled: true, sev: "critical",
      rego: 'violation[msg] {\n  input.securityContext.privileged == true\n  msg := "privileged containers are not allowed"\n}',
      check: p => p.privileged ? "privileged: true is forbidden by policy" : null },
    { id: "run-as-nonroot", name: "require runAsNonRoot", enabled: false, sev: "high",
      rego: 'violation[msg] {\n  not input.securityContext.runAsNonRoot\n  msg := "containers must set runAsNonRoot: true"\n}',
      check: p => p.runAsNonRoot ? null : "runAsNonRoot must be true" },
    { id: "require-limits", name: "require CPU/memory limits", enabled: false, sev: "medium",
      rego: 'violation[msg] {\n  not input.resources.limits.cpu\n  msg := "cpu/memory limits are required"\n}',
      check: p => (p.cpuLimit && p.memLimit) ? null : "resource limits (cpu & memory) are required" },
  ],
  podSpec: {
    name: "web", image: "nginx:latest", labels: { app: "web" },
    privileged: false, runAsNonRoot: false, allowPrivEsc: true, hostNetwork: false,
    cpuLimit: "", memLimit: "", addedCaps: [],
  },
};

// RBAC evaluation --------------------------------------------------------------
function subjectKind(id) { return id.startsWith("system:serviceaccount:") ? "ServiceAccount" : "User"; }
function authorize(subject, verb, resource, group = "") {
  const b = APP.rbac.bindings.filter(x => x.subject === subject);
  for (const bind of b) {
    const role = APP.rbac.roles[bind.role];
    if (!role) continue;
    for (const r of role.rules) {
      const g = r.apiGroups.includes("*") || r.apiGroups.includes(group);
      const res = r.resources.includes("*") || r.resources.includes(resource);
      const vb = r.verbs.includes("*") || r.verbs.includes(verb);
      if (g && res && vb) return { allowed: true, via: bind.role, rule: r };
    }
  }
  return { allowed: false };
}

// OPA / admission evaluation ---------------------------------------------------
function evalPolicies(pod) {
  return APP.opa.filter(p => p.enabled).map(p => {
    const msg = p.check(pod);
    return { id: p.id, name: p.name, sev: p.sev, ok: !msg, msg };
  });
}

// Security scan ----------------------------------------------------------------
function securityScan(p) {
  const f = [];
  if (p.privileged) f.push(["critical", "privileged: true", "Container runs with all host capabilities — full node compromise if breached. Set privileged:false."]);
  if (p.addedCaps.includes("SYS_ADMIN")) f.push(["critical", "CAP_SYS_ADMIN added", "SYS_ADMIN is near‑root. Drop it; add only the minimal capabilities you need."]);
  if (!p.runAsNonRoot) f.push(["high", "runs as root (runAsNonRoot not set)", "Set runAsNonRoot:true and a non‑zero runAsUser to reduce blast radius."]);
  if (p.allowPrivEsc) f.push(["high", "allowPrivilegeEscalation not disabled", "Set allowPrivilegeEscalation:false to block setuid escalation."]);
  if (p.hostNetwork) f.push(["high", "hostNetwork: true", "Pod shares the node network namespace — can sniff/spoof node traffic."]);
  if (/:latest$/.test(p.image) || !p.image.includes(":")) f.push(["medium", "unpinned image tag (:latest)", "Pin a digest or explicit version for reproducible, auditable deploys."]);
  if (!p.cpuLimit || !p.memLimit) f.push(["medium", "no resource limits", "Missing limits enable noisy‑neighbour & resource‑exhaustion DoS."]);
  if (f.length === 0) f.push(["pass", "no major issues found", "This pod follows common hardening best practices. 🎉"]);
  return f;
}

const FLOW_STAGES = [

function renderFlow() {
  $("#view-flow").innerHTML = `

      </div>
    </div></div>
    <div class="grid cols-2" style="margin-top:16px">

      <div class="panel"><div class="ph">What happens here?</div><div class="pb" id="flow-explain"><p class="hint">Each stage lights up as the request reaches it. Green = passed, red = rejected (the request stops there, exactly like a real API server short‑circuits on the first failing gate).</p></div></div>
    </div>`;
  $("#flow-id").onchange = e => { APP.identity = e.target.value; };
  $("#flow-podsummary").textContent = `${APP.podSpec.name} image=${APP.podSpec.image} labels=${JSON.stringify(APP.podSpec.labels)} privileged=${APP.podSpec.privileged}`;

function flowLog(msg, cls = "") { const l = $("#flow-log"); l.innerHTML += `<div class="${cls}">${msg}</div>`; l.scrollTop = l.scrollHeight; }
async function moveToken(stageId) {
  const token = $("#flow-token"); const stage = $("#stage-" + stageId); const pipe = $("#pipeline");
  const pr = pipe.getBoundingClientRect(); const sr = stage.getBoundingClientRect();
  const x = sr.left - pr.left + pipe.scrollLeft + sr.width / 2 - 17;
  token.style.opacity = "1";
  token.style.transform = `translateX(${x}px)`;
  await sleep(950);
}
async function runFlow() {
  const btn = $("#flow-run"); btn.disabled = true;
  $$(".stage").forEach(s => s.className = "stage");
  $("#flow-log").innerHTML = ""; $("#flow-token").style.opacity = "0"; $("#flow-token").style.transform = "translateX(0)";
  const p = APP.podSpec; let blocked = false;
  const setSub = (id, t) => $("#sub-" + id).textContent = t;
  const explain = h => $("#flow-explain").innerHTML = h;

  flowLog(`→ POST /api/v1/namespaces/default/pods  (as ${APP.identity})`, "info");
  await sleep(300);

  // client
  $("#stage-client").classList.add("active"); await moveToken("client");
  $("#stage-client").classList.remove("active"); $("#stage-client").classList.add("pass");
  flowLog("kubectl serialized the Pod manifest and sent it over TLS to kube‑apiserver.", "muted");

  // authn
  $("#stage-authn").classList.add("active"); await moveToken("authn");
  const kind = subjectKind(APP.identity);
  setSub("authn", kind + " identified");
  $("#stage-authn").classList.replace("active", "pass") || $("#stage-authn").classList.add("pass");
  flowLog(`AuthN ✓ identity established as ${kind}: ${APP.identity}`, "ok");
  explain(`<b>Authentication</b> answers <i>“who are you?”</i> using client certs, bearer tokens, ServiceAccount tokens or OIDC. It does <b>not</b> decide permissions — that's the next stage. Here the request is a <code>${kind}</code>.`);

  // authz
  $("#stage-authz").classList.add("active"); await moveToken("authz");
  const az = authorize(APP.identity, "create", "pods", "");
  if (az.allowed) {
    $("#stage-authz").classList.replace("active", "pass"); $("#stage-authz").classList.add("pass");
    setSub("authz", "allowed via " + az.via);
    flowLog(`AuthZ ✓ RBAC allows create pods (via role “${az.via}”)`, "ok");
    explain(`<b>Authorization (RBAC)</b> answers <i>“are you allowed to do this?”</i>. A binding maps <code>${APP.identity}</code> to role <code>${az.via}</code>, whose rule permits <code>create</code> on <code>pods</code>. Edit rules in the RBAC Lab.`);
  } else {
    $("#stage-authz").classList.add("fail"); setSub("authz", "FORBIDDEN"); blocked = "authz";
    flowLog(`AuthZ ✗ Forbidden: ${APP.identity} cannot create pods (no matching RBAC rule)`, "err");
    explain(`<b>Authorization denied.</b> No RoleBinding grants <code>${APP.identity}</code> the verb <code>create</code> on <code>pods</code>. The apiserver returns <code>403 Forbidden</code> and the request stops here. Grant access in the RBAC Lab (e.g. bind it to <code>pod-creator</code>).`);
  }

  if (!blocked) {
    // mutating
    $("#stage-mutate").classList.add("active"); await moveToken("mutate");
    $("#stage-mutate").classList.replace("active", "pass"); $("#stage-mutate").classList.add("pass");
    setSub("mutate", "defaults injected");
    flowLog("Mutating admission ✓ injected default ServiceAccount, added labels, set imagePullPolicy.", "ok");
    explain(`<b>Mutating admission webhooks</b> can <i>change</i> the object before it's stored — injecting sidecars (e.g. Istio), defaulting fields, adding labels. They run before validating webhooks.`);

    // validating (OPA + podsecurity)
    $("#stage-validate").classList.add("active"); await moveToken("validate");
    const results = evalPolicies(p);
    const violations = results.filter(r => !r.ok);
    if (violations.length === 0) {
      $("#stage-validate").classList.replace("active", "pass"); $("#stage-validate").classList.add("pass");
      setSub("validate", "policies passed");
      flowLog(`Validating admission ✓ ${results.length} OPA constraint(s) satisfied.`, "ok");
      explain(`<b>Validating admission</b> (OPA/Gatekeeper, Pod Security) can only <i>accept or reject</i>. All ${results.length} enabled constraints passed. Toggle constraints in the OPA Lab to see rejections.`);
    } else {
      $("#stage-validate").classList.add("fail"); setSub("validate", violations.length + " violation(s)"); blocked = "validate";
      violations.forEach(v => flowLog(`Validating admission ✗ [${v.name}] ${v.msg}`, "err"));
      explain(`<b>Admission rejected</b> by policy. ${violations.map(v=>`<div style="margin-top:6px">• <b>${v.name}</b>: ${v.msg}</div>`).join("")}<div style="margin-top:8px">Fix the pod in the Security Lab or relax the policy in the OPA Lab, then re‑run.</div>`);
    }
  }

  if (!blocked) {
    $("#stage-etcd").classList.add("active"); await moveToken("etcd");
    $("#stage-etcd").classList.replace("active", "pass"); $("#stage-etcd").classList.add("pass");
    flowLog("etcd ✓ Pod object persisted as desired state (status: Pending).", "ok");
    $("#stage-schedule").classList.add("active"); await moveToken("schedule");
    $("#stage-schedule").classList.replace("active", "pass"); $("#stage-schedule").classList.add("pass");
    const node = "kube-worker-" + (1 + Math.floor(Math.random() * 2));
    setSub("schedule", "→ " + node);
    flowLog(`Scheduler ✓ filtered + scored nodes, bound Pod to ${node}.`, "ok");
    $("#stage-kubelet").classList.add("active"); await moveToken("kubelet");
    $("#stage-kubelet").classList.replace("active", "pass"); $("#stage-kubelet").classList.add("pass");
    setSub("kubelet", "Running");
    flowLog(`kubelet on ${node} ✓ pulled ${p.image}, created container → Pod Running. 🎉`, "ok");
    explain(`<b>Request admitted!</b> The desired state is in etcd. Controllers/scheduler/kubelet then <i>reconcile</i> reality to match: node bound, image pulled, container started. This watch‑reconcile loop is the heart of Kubernetes.`);
  } else {
    flowLog(`✗ Request rejected at the ${blocked === "authz" ? "Authorization" : "Validating Admission"} stage — nothing was written to etcd.`, "err");
  }
  btn.disabled = false;
}

async function runReconcile(first) {
  $("#op-apply").disabled = true; $("#op-scale").disabled = true;
  const n = $("#op-name").value, eng = $("#op-engine").value, rep = $("#op-replicas").value;
  for (let i = 0; i < 6; i++) { const s = $("#rs-"+i); s.className = "rstep"; }

  for (let i = 0; i < 6; i++) {
    const s = $("#rs-" + i); s.classList.add("on"); await sleep(650);

    if (i === 5) reveal("#m-status", `status: Ready ✓`);
    s.classList.remove("on"); s.classList.add("done");
  }
  operatorState.applied = true; $("#op-apply").disabled = false; $("#op-scale").disabled = false;
}

const CUBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>';
const cluster = { nodes: [], deployments: {}, pods: [], services: {} };
let podSeq = 0, ipSeq = 10, svcSeq = 10, pgReady = false;
function pgInit() {
  cluster.nodes = [{ name: "kube-control-plane", role: "control-plane", status: "Ready" }, { name: "kube-worker-1", role: "<none>", status: "Ready" }, { name: "kube-worker-2", role: "<none>", status: "Ready" }];

function randStr(n){ const c="abcdefghijklmnopqrstuvwxyz0123456789"; let s=""; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

function podsOf(d){ return cluster.pods.filter(p=>p.deploy===d&&p.status!=="Terminating"); }

  setTimeout(()=>{ if(!cluster.pods.includes(pod))return; pod.status="Running"; pod.ip=`10.244.${Math.floor(ipSeq/254)}.${(ipSeq++%254)+1}`; pgRender(); },1600); }

function reconcilePG(){ Object.values(cluster.deployments).forEach(d=>{ const a=podsOf(d.name); if(a.length<d.replicas){ for(let i=a.length;i<d.replicas;i++) newPod(d.name);} else if(a.length>d.replicas){ a.sort((x,y)=>y.born-x.born).slice(0,a.length-d.replicas).forEach(terminate);} }); }

function pgRender() {

function pgArgs(t){ const o={_:[]}; t.forEach(x=>{ if(x.startsWith("--")){const[k,v]=x.slice(2).split("=");o[k]=v===undefined?true:v;} else o._.push(x); }); return o; }
function pgRun(raw) {

}
function pgKubectl(t) {

function pgGetDeploy(pad){ const n=Object.keys(cluster.deployments); if(!n.length)return pgPrint("No deployments.","muted"); pgPrint(pad("NAME",16)+pad("READY",8)+"IMAGE"); n.forEach(x=>{const d=cluster.deployments[x];const r=podsOf(x).filter(p=>p.status==="Running").length;pgPrint(pad(x,16)+pad(r+"/"+d.replicas,8)+d.image);}); }
function pgGetSvc(pad){ const n=Object.keys(cluster.services); if(!n.length)return pgPrint("No services.","muted"); pgPrint(pad("NAME",16)+pad("TYPE",12)+pad("CLUSTER-IP",16)+"PORT"); n.forEach(x=>{const s=cluster.services[x];pgPrint(pad(x,16)+pad(s.type,12)+pad(s.clusterIP,16)+(s.type==="NodePort"?s.port+":"+s.nodePort:s.port)+"/TCP");}); }

  { q: "OPA Gatekeeper enforces policy as which kind of admission webhook?", opts: ["Mutating", "Validating", "Authorization", "Authentication"], a: 1, e: "Gatekeeper is a validating admission webhook: it evaluates Rego constraints and rejects non-compliant objects (it doesn't mutate them)." },
  { q: "An Operator is best described as…", opts: ["A managed cloud service", "A CRD plus a controller with a reconcile loop", "A type of Service", "A node agent"], a: 1, e: "Operators extend the API with a CRD and add a controller that reconciles the custom resource's desired state into real objects." },
  { q: "What does kube-proxy program on each node?", opts: ["Container images", "iptables/IPVS rules for Service VIPs", "etcd snapshots", "Pod manifests"], a: 1, e: "kube-proxy watches Services/Endpoints and programs netfilter (iptables/IPVS/eBPF) so ClusterIP traffic load-balances to pod endpoints." },
  { q: "A projected (bound) ServiceAccount token is rejected after the pod is deleted because…", opts: ["NetworkPolicy dropped it", "It has no signature", "It is bound to the Pod UID, has an expiry, and an audience — TokenReview fails when the pod is gone", "etcd garbage-collects JWTs"], a: 2, e: "Bound tokens are issued via the TokenRequest API with aud, exp, and boundObjectRef. Legacy Secret tokens have none of those and survive pod deletion. See the AuthN Deep Dive." },
];
let quizIdx = 0, quizScore = 0, quizAnswered = false;
const FAQ = [
  ["Walk me through what happens when I run `kubectl apply -f pod.yaml`.", "kubectl authenticates to the apiserver over TLS and POSTs the manifest. The apiserver runs Authentication → Authorization (RBAC) → Mutating admission → Validating admission (OPA/PodSecurity), then persists the desired state to etcd. The scheduler watches for unscheduled pods and binds one to a node; the kubelet on that node pulls the image via the CRI runtime and starts the container, reporting status back. Controllers keep reconciling actual→desired. (See the Request Flow tab for the animation.)"],
  ["What's the difference between a Role and a ClusterRole?", "A Role is namespaced — its rules apply within one namespace. A ClusterRole is cluster-scoped and can grant access to cluster-scoped resources (nodes, PVs), non-resource URLs, or namespaced resources across all namespaces. RoleBinding binds within a namespace; ClusterRoleBinding binds cluster-wide."],
  ["How does Kubernetes self-heal?", "Through reconciliation. Controllers watch objects and continuously drive actual state toward the declared desired state. If a pod dies, the ReplicaSet controller notices replicas < desired and creates a new one; if a node dies, pods are rescheduled elsewhere."],
  ["What are the main container security best practices?", "Run as non-root (runAsNonRoot + runAsUser), set allowPrivilegeEscalation:false, drop ALL capabilities and add back only what's needed, avoid privileged and hostNetwork/hostPID, use read-only root filesystem, pin image digests, set resource limits, scan images, and enforce Pod Security Standards / OPA at admission."],
  ["Mutating vs validating admission webhooks?", "Mutating webhooks run first and can modify the object (inject sidecars, set defaults). Validating webhooks run after and can only accept or reject. Both run after authN/authZ and before persistence. OPA Gatekeeper is typically validating."],
  ["When would you write an Operator instead of using a Deployment?", "When managing a stateful or complex application needs domain-specific operational logic — e.g. ordered scaling, backups, failover, version upgrades for a database. The operator encodes that human runbook as a controller reconciling a CRD."],
  ["What's the difference between a legacy ServiceAccount token and a bound projected token?", "Legacy tokens (pre-1.24 default) are Secrets in etcd: no expiry, no audience, not bound to a pod — they still authenticate after the pod is deleted. Bound tokens are minted by the TokenRequest API, projected into the pod by the kubelet, carry aud + exp + the pod UID, and fail TokenReview when the pod is gone or the clock is past exp. Also disable automount on the default SA so workloads that never call the API don't get a credential at all. (AuthN Deep Dive lab.)"],
];
function renderInterview() {
  $("#view-interview").innerHTML = `
    <h2 class="title">Interview Prep</h2>
    <p class="subtitle">Test yourself with a scored quiz, then review deep-dive answers to the questions interviewers actually ask.</p>
    <div class="grid cols-2">
      <div class="panel"><div class="ph">Quiz <span class="badge-count" id="q-progress"></span></div><div class="pb" id="quiz-body"></div></div>
      <div class="panel"><div class="ph">Deep-dive FAQ</div><div class="pb">${FAQ.map(f=>`<details class="faq"><summary>${f[0]}</summary><div class="a">${f[1]}</div></details>`).join("")}</div></div>
    </div>`;
  renderQuiz();
}
function renderQuiz() {
  const done = quizIdx >= QUIZ.length;
  $("#q-progress").textContent = done ? `score ${quizScore}/${QUIZ.length}` : `Q${quizIdx+1}/${QUIZ.length} · score ${quizScore}`;
  const body = $("#quiz-body");
  if (done) {
    const pct = Math.round(quizScore/QUIZ.length*100);
    body.innerHTML = `<div style="text-align:center;padding:20px 0"><div class="score" style="color:${pct>=70?'var(--green)':pct>=40?'var(--amber)':'var(--red)'}">${pct}%</div><p>You scored <b>${quizScore}/${QUIZ.length}</b>. ${pct>=70?'Interview‑ready! 🎉':'Review the FAQ and labs, then retry.'}</p><button class="btn" id="q-restart">↻ Restart quiz</button></div>`;
    $("#q-restart").onclick = () => { quizIdx=0; quizScore=0; quizAnswered=false; renderQuiz(); };
    return;
  }
  const item = QUIZ[quizIdx]; quizAnswered = false;
  body.innerHTML = `<p style="font-weight:600;font-size:15px;margin-top:0">${item.q}</p><div id="q-opts">${item.opts.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o}</button>`).join("")}</div><div id="q-expl"></div>`;
  $$("#q-opts .quiz-opt").forEach(b => b.onclick = () => {
    if (quizAnswered) return; quizAnswered = true;
    const i = +b.dataset.i; const correct = i === item.a;
    if (correct) quizScore++;
    $$("#q-opts .quiz-opt").forEach((x,xi)=>{ x.disabled=true; if(xi===item.a)x.classList.add("correct"); if(xi===i&&!correct)x.classList.add("wrong"); });
    $("#q-expl").innerHTML = `<div class="expl"><b>${correct?'✓ Correct.':'✗ Not quite.'}</b> ${item.e}</div><button class="btn" id="q-next" style="margin-top:12px">${quizIdx===QUIZ.length-1?'See results':'Next question →'}</button>`;
    $("#q-progress").textContent = `Q${quizIdx+1}/${QUIZ.length} · score ${quizScore}`;
    $("#q-next").onclick = () => { quizIdx++; renderQuiz(); };
  });
}

const RENDER = { overview: renderOverview, architecture: renderArchitecture, flow: renderFlow, rbac: renderRbac, security: renderSecurity, opa: renderOpa, operators: renderOperators, playground: renderPlayground, interview: renderInterview };
function navigate(view) {
  if (!RENDER[view]) view = "overview";
  $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  $$(".view").forEach(v => v.classList.remove("active"));
  $("#view-" + view).classList.add("active");
  RENDER[view]();
  location.hash = view;
  window.scrollTo(0, 0);
}
// Event delegation so dynamically‑added modules (see kubelab-cks.js) get wired automatically.
$("#nav").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (b) navigate(b.dataset.view); });

// Extension API — external module files plug new labs into the same app shell.
window.KL = {
  $, $$, sleep, esc, APP, authorize, evalPolicies, securityScan, subjectKind, RENDER, navigate,
  // Add a sidebar nav group with buttons: items = [[view, icon, label], ...]
  addNavGroup(title, items) {
    const nav = $("#nav");
    const g = document.createElement("div"); g.className = "navgroup"; g.textContent = title; nav.appendChild(g);
    items.forEach(([view, icon, label]) => {
      const b = document.createElement("button"); b.dataset.view = view;
      b.innerHTML = `<span class="ic">${icon}</span> ${label}`; nav.appendChild(b);
    });
  },
  // Register a view: creates its <section> container (if needed) and its render fn.
  addView(view, renderFn) {
    if (!$("#view-" + view)) {
      const s = document.createElement("section"); s.className = "view"; s.id = "view-" + view;
      $(".main").appendChild(s);
    }
    RENDER[view] = renderFn;
  },
  injectCSS(css) { const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s); },
};

navigate((location.hash || "#overview").slice(1));
</script>
